name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - name: Check bundled binaries
        shell: pwsh
        run: |
          if (!(Test-Path vendor/pcsx2/pcsx2-qt.exe)) { throw "PCSX2 portatil ausente em vendor/pcsx2" }
          if (!(Test-Path vendor/rclone/rclone.exe)) { throw "rclone ausente em vendor/rclone" }
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: GameServerPS2-Installer
          path: release/*.exe
